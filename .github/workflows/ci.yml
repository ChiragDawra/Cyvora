name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ingestion + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements-dev.txt
          pip install -r backend/requirements.txt
      - name: Compile check
        run: |
          python -m compileall ingestion backend
      - name: Test (ingestion)
        working-directory: ingestion
        run: python -m pytest -q
      - name: Test (backend)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Lambda layer (smoke test - lambda.tf's archive_file needs this directory)
        run: ./ingestion/build_layer.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Init (no backend, no state)
        working-directory: infra
        run: terraform init -backend=false
      - name: Validate
        working-directory: infra
        run: terraform validate
      # `terraform plan`/`apply` need real AWS credentials, so they don't run here.
      # -backend=false skips the S3 backend in infra/backend.tf, which validate doesn't
      # need. The actual apply happens in .github/workflows/deploy.yml, which runs after
      # this workflow succeeds on main and authenticates via OIDC.
