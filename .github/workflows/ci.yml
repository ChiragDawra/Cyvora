name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ingestion + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements-dev.txt
          pip install -r backend/requirements.txt
      - name: Compile check
        run: |
          python -m compileall ingestion backend
      - name: Test (ingestion)
        working-directory: ingestion
        run: python -m pytest -q
      # TODO: add backend/ tests once backend/api/handler.py has a moto-mocked DynamoDB test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Lambda layer (smoke test - lambda.tf's archive_file needs this directory)
        run: ./ingestion/build_layer.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Init (no backend, no state)
        working-directory: infra
        run: terraform init -backend=false
      - name: Validate
        working-directory: infra
        run: terraform validate
      # `terraform plan`/`apply` need real AWS credentials and are deliberately not run
      # here yet - no AWS OIDC role or secrets are configured for this repo. Applies are
      # run manually via infra/run.sh until that's set up. See EXECUTION_GUIDE.md.

  # TODO (once AWS OIDC role + GitHub secrets are set up): add a `deploy` job gated on
  # github.ref == 'refs/heads/main' that runs `terraform apply` and syncs the built
  # frontend to S3/CloudFront.
